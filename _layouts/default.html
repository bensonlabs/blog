<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    Content-Security-Policy:
    - 'unsafe-inline' is required for script-src and style-src because all scripts
      and styles are inline. Refactoring them to external files would allow removing it.
    - frame-ancestors 'none' prevents clickjacking but is ignored in <meta> tags per spec;
      it only works via an HTTP response header, which GitHub Pages does not support.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {% seo %}
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/workouts/' | relative_url }}">Workouts</a>
        <a href="{{ '/games/' | relative_url }}">Games</a>
        <a href="{{ '/bootstraps/' | relative_url }}" style="color: #fca5a5;">bootstraps</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author.name }} &mdash;
        <a href="{{ '/feed.xml' | relative_url }}">RSS Feed</a>
      </p>
    </div>
  </footer>
</body>
</html>
