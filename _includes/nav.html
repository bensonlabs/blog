{%- comment -%}
  Site nav for Jekyll-rendered pages. Links from _data/navigation.yml.
  Hamburger collapses below 820px. Palette hardcoded, high-specificity.
{%- endcomment -%}
<nav class="bl-nav" id="bl-nav" aria-label="Site navigation">
  <a href="{{ '/' | relative_url }}" class="bl-nav__brand">bensonlabs</a>
  <button class="bl-nav__toggle" id="bl-nav-toggle" type="button" aria-controls="bl-nav-links" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <div class="bl-nav__links" id="bl-nav-links">
    {%- for item in site.data.navigation -%}
      <a href="{{ item.url | relative_url }}" class="bl-nav__link{% if page.url == item.url %} is-active{% endif %}">{{ item.title }}</a>
    {%- endfor -%}
  </div>
</nav>
