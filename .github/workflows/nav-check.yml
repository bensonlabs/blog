name: Rendered pages
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Same as jekyll.yml: the workout pages live in bensonlabs/workouts, and the
      # header links to them, so the rendered-pages check needs them staged too.
      - name: Checkout public workout source
        uses: actions/checkout@v7
        with:
          repository: bensonlabs/workouts
          ref: main
          path: .workouts-source
      - name: Stage workout pages
        run: |
          python3 .github/scripts/stage_workout.py .workouts-source/justin/index.html projects/workouts/index.html
          python3 .github/scripts/stage_workout.py .workouts-source/cl/index.html projects/workouts/cl/index.html
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/games/dungeon-crawler/package-lock.json
      - name: Build Dungeon Crawler without injection
        working-directory: projects/games/dungeon-crawler
        run: |
          npm ci
          npm run build
          rm -rf assets
          cp -r dist/assets assets
          cp dist/index.source.html index.html
      - run: python3 .github/scripts/check_dungeon_build.py
      - name: Generate catalogue for this Jekyll build
        run: python3 .github/scripts/build_games_registry.py
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - run: bash .github/scripts/check-nav.sh _site
