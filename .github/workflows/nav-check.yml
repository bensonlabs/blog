name: Rendered pages
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Test the site scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      # Same assembly as the deploy (jekyll.yml): the pinned games and workouts releases.
      - name: Put the components in place (games, workouts)
        run: python3 .github/scripts/components.py assemble
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - run: bash .github/scripts/check-nav.sh _site
