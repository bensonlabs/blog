name: Nav consistency

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nav-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Apply deterministic nav fixes
        run: bash .github/scripts/fix-nav.sh

      - name: Run navigation invariants check
        run: bash .github/scripts/check-nav.sh

      - name: Detect nav fixer changes
        id: nav_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-commit nav fixes on branch pushes
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]' && steps.nav_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/index.html projects/*/index.html projects/games/*/index.html
          git commit -m "chore(nav): auto-fix canonical nav snippet"
          git push

      - name: Require contributors to commit nav fixes on PRs
        if: github.event_name == 'pull_request' && steps.nav_changes.outputs.has_changes == 'true'
        run: |
          echo "::error::Navigation fixes are required. Run 'bash .github/scripts/fix-nav.sh' locally and commit the resulting changes."
          git --no-pager diff -- projects/index.html projects/*/index.html projects/games/*/index.html
          exit 1
