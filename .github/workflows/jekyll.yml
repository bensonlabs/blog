name: Deploy Jekyll to GitHub Pages
# Builds the whole site (the blog plus its pinned components), checks it and publishes it. Runs on
# every push to master and by hand. The Update components workflow also runs it inside its own run
# (workflow_call) after pinning a release, or when the live site isn't serving master, so a failed
# deploy turns that run red too.

on:
  push:
    branches:
      - master
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "The commit to build and deploy"
        type: string
        required: true

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Test the site scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Put the components in place (games, projects)
        run: python3 .github/scripts/components.py assemble

      # Update components reads this file to tell whether the live site serves master.
      - name: Record the commit being deployed
        run: git rev-parse HEAD > deployed-commit.txt

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Validate rendered pages
        run: bash .github/scripts/check-nav.sh _site

      - name: Inspect Pages artifact contents
        run: |
          test -d _site
          test -s _site/deployed-commit.txt
          du -sh _site
          if find _site -type l -print -quit | grep -q .; then echo "::error::_site holds a symbolic link"; exit 1; fi
          if find _site -path '*/node_modules/*' -print -quit | grep -q .; then echo "::error::_site holds node_modules"; exit 1; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Retry deploy to GitHub Pages
        id: deployment_retry
        if: ${{ steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
