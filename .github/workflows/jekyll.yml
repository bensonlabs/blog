name: Deploy Jekyll to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/games/dungeon-crawler/package-lock.json

      - name: Build dungeon crawler
        working-directory: projects/games/dungeon-crawler
        run: |
          npm ci
          npm run build
          rm -rf assets
          cp -r dist/assets assets
          cp dist/index.source.html index.html

      - name: Verify generated dungeon handoff
        run: python3 .github/scripts/check_dungeon_build.py

      - name: Generate catalogue for this Pages artifact
        run: python3 .github/scripts/build_games_registry.py

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Validate rendered pages
        run: bash .github/scripts/check-nav.sh _site

      - name: Inspect Pages artifact contents
        run: |
          test -d _site
          du -sh _site
          find _site -type l -print -quit | grep . && exit 1 || true
          find _site -path '*/node_modules/*' -print -quit | grep . && exit 1 || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Retry deploy to GitHub Pages
        id: deployment_retry
        if: ${{ steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
