name: Games registry
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Test metadata contracts and source immutability
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Generate catalogue without changing authored files
        run: |
          python3 .github/scripts/build_games_registry.py
          git diff --exit-code
