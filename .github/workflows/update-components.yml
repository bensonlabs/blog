name: Update components
# Pins a component's new release and deploys, after the whole site builds and passes its checks.
# The games and projects repos' Release workflows start it right after publishing (gh workflow
# run, with their BLOG_DISPATCH_TOKEN). It also runs daily, so a release whose request didn't
# arrive still goes live, and by hand from the Actions tab ("Run workflow") for any component.
on:
  workflow_dispatch:
    inputs:
      component:
        description: "Component to update (games, projects), or all"
        default: all
      version:
        description: "Version to pin, or latest"
        default: latest
  schedule:
    - cron: "17 13 * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: update-components
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Pin the new release
        env:
          COMPONENT: ${{ inputs.component || 'all' }}
          VERSION: ${{ inputs.version || 'latest' }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/components.py update "$COMPONENT" "$VERSION"
      - name: Anything new?
        id: changed
        run: |
          if git diff --quiet -- _data/components.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Already up to date; nothing to deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"; git diff -- _data/components.json
          fi
      - name: Test the site scripts
        if: steps.changed.outputs.changed == 'true'
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Put the components in place
        if: steps.changed.outputs.changed == 'true'
        run: python3 .github/scripts/components.py assemble
      - name: Build the site
        if: steps.changed.outputs.changed == 'true'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check the rendered pages
        if: steps.changed.outputs.changed == 'true'
        run: bash .github/scripts/check-nav.sh _site
      - name: Commit the pin and deploy
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -F .components-cache/commit-message.txt -- _data/components.json
          git push
          gh workflow run jekyll.yml --ref "$GITHUB_REF_NAME"
          echo "Pinned and asked the deploy workflow to publish it."
