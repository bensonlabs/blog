<!DOCTYPE html>
<html lang="en">
<head>
<!-- bl-game-meta
title: LumenTrace
emoji: ⚡
order: 65
description: Slide charged light through the grid and trace every empty path without getting trapped. A neon Rust-powered puzzle built for the browser.
-->
    <meta charset="utf-8">
    <title>LumenTrace</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LumenTrace - A beautiful Rust-powered neon sliding block puzzle game compiled to WebAssembly.">
    <style>
        html,
        body,
        canvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a0b10;
            display: block;
            touch-action: none;
        }
        #glcanvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
<!-- Add tabindex="0" and autofocus to ensure the canvas can receive focus and capture key events -->
    <canvas id="glcanvas" tabindex="0" autofocus></canvas>
    <!-- Miniquad CDN JS bundle for WebAssembly initialization -->
    <script src="https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js"></script>
    <script>
        // Automatically focus the canvas when the page is loaded
        window.addEventListener("load", () => {
            const canvas = document.getElementById("glcanvas");
            canvas.focus();
            
            // Re-focus canvas on any click to prevent losing key events
            document.addEventListener("click", () => {
                canvas.focus();
            });
        });
        load("./lumentrace.wasm");
    </script>
</body>
</html>
