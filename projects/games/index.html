<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!--
    Content-Security-Policy:
    - 'unsafe-inline' is required for script-src and style-src because all scripts
      and styles are inline. Refactoring them to external files would allow removing it.
    - frame-ancestors 'none' prevents clickjacking but is ignored in <meta> tags per spec;
      it only works via an HTTP response header, which GitHub Pages does not support.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games — Benson Labs</title>
  <style>
    /* ── OBSIDIAN DARK THEME ── */
    :root {
      --bg:      #1e1e1e;
      --surface: #252525;
      --card:    #2d2d2d;
      --border:  #3a3a3a;
      --text:    #dcddde;
      --muted:   #888;
      --accent:  #7c3aed;
      --accent2: #a78bfa;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 60px;
    }

    /* ── HEADER ── */
    .page-header {
      width: 100%;
      max-width: 800px;
      margin-bottom: 40px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 20px;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--accent2); }

    .page-header h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .page-header h1 span { color: var(--accent2); }

    .page-header p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 1rem;
    }

    /* ── GAME GRID ── */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 800px;
    }

    /* ── GAME CARD ── */
    .game-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      outline-offset: 3px;
    }

    .game-card:hover,
    .game-card:focus-visible {
      border-color: var(--accent2);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.2);
    }

    .card-icon {
      font-size: 2.6rem;
      line-height: 1;
      user-select: none;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .card-desc {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.55;
      flex: 1;
    }

    .card-play {
      display: inline-block;
      margin-top: 4px;
      padding: 9px 20px;
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.3px;
      transition: background 0.15s, opacity 0.15s;
      pointer-events: none; /* card <a> handles the click */
    }
    .game-card:hover .card-play,
    .game-card:focus-visible .card-play { background: var(--accent2); }
    .game-card:active .card-play { opacity: 0.8; }

    /* ── FOOTER ── */
    .page-footer {
      margin-top: 60px;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .page-footer a { color: var(--muted); text-decoration: none; }
    .page-footer a:hover { color: var(--accent2); }
  </style>
</head>
<body>

  <div class="page-header">
    <a class="back-link" href="/">← bensonlabs.org</a>
    <h1>Games <span>↗</span></h1>
    <p>A growing collection of browser-based games.</p>
  </div>

  <div class="games-grid" id="games-grid"></div>

  <footer class="page-footer">
    <p><a href="/">← Back to blog</a></p>
  </footer>

  <script>
    // ── GAMES REGISTRY ──────────────────────────────────────────────────────
    // To add a new game, append an entry to this array.
    const GAMES = [
      {
        title: "2048",
        description: "Slide tiles on a 4×4 grid and merge matching numbers to reach 2048. Classic gameplay with undo, score tracking, and full touch support.",
        emoji: "🔢",
        path: "/projects/games/2048/",
      },
      {
        title: "not-Wordle",
        description: "Guess the hidden 5-letter word in six tries. Each guess reveals which letters are correct, present, or absent.",
        emoji: "🟩",
        path: "/projects/games/not-wordle/",
      },
      {
        title: "brick-break",
        description: "Classic brick-breaker with 3 difficulty levels, angle-based paddle physics, level progression, and high-score tracking.",
        emoji: "🧱",
        path: "/projects/games/breakout/",
      },
      {
        title: "Orbit Bloom",
        description: "Harvest glowing motes as your shield while surviving an ever-faster comet swarm. Pulse at the right moment to clear the field. Two versions to choose from.",
        emoji: "🌸",
        path: "/projects/games/orbit-bloom/",
      },
      {
        title: "The Last Signal",
        description: "A text-based sci-fi adventure. Play as Dr. Mara Chen investigating an abandoned research station. Three acts, one station, two endings — no keyboard required.",
        emoji: "📡",
        path: "/projects/games/last-signal/",
      },
    ];
    // ────────────────────────────────────────────────────────────────────────

    const grid = document.getElementById("games-grid");

    GAMES.forEach(game => {
      const card = document.createElement("a");
      card.className = "game-card";
      card.href = game.path;

      const icon = document.createElement("div");
      icon.className = "card-icon";
      icon.textContent = game.emoji;

      const title = document.createElement("div");
      title.className = "card-title";
      title.textContent = game.title;

      const desc = document.createElement("div");
      desc.className = "card-desc";
      desc.textContent = game.description;

      const play = document.createElement("span");
      play.className = "card-play";
      play.textContent = "Play →";

      card.append(icon, title, desc, play);
      grid.appendChild(card);
    });
  </script>

</body>
</html>
