<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!--
    Content-Security-Policy:
    - 'unsafe-inline' is required for script-src and style-src because all scripts
      and styles are inline. Refactoring them to external files would allow removing it.
    - frame-ancestors 'none' prevents clickjacking but is ignored in <meta> tags per spec;
      it only works via an HTTP response header, which GitHub Pages does not support.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games — Benson Labs</title>
  <style>
    /* ── OBSIDIAN DARK THEME ── */
    :root {
      --bg:      #1e1e1e;
      --surface: #252525;
      --card:    #2d2d2d;
      --border:  #3a3a3a;
      --text:    #dcddde;
      --muted:   #888;
      --accent:  #7c3aed;
      --accent2: #a78bfa;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 60px;
    }

    /* ── HEADER ── */
    .page-header {
      width: 100%;
      max-width: 800px;
      margin-bottom: 40px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 20px;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--accent2); }

    .page-header h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .page-header h1 span { color: var(--accent2); }

    .page-header p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 1rem;
    }

    /* ── GAME GRID ── */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 800px;
    }

    /* ── GAME CARD ── */
    .game-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      outline-offset: 3px;
    }

    .game-card:hover,
    .game-card:focus-visible {
      border-color: var(--accent2);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.2);
    }

    .card-icon {
      font-size: 2.6rem;
      line-height: 1;
      user-select: none;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .card-desc {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.55;
      flex: 1;
    }

    .card-play {
      display: inline-block;
      margin-top: 4px;
      padding: 9px 20px;
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.3px;
      transition: background 0.15s, opacity 0.15s;
      pointer-events: none; /* card <a> handles the click */
    }
    .game-card:hover .card-play,
    .game-card:focus-visible .card-play { background: var(--accent2); }
    .game-card:active .card-play { opacity: 0.8; }

    /* ── FOOTER ── */
    .page-footer {
      margin-top: 60px;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .page-footer a { color: var(--muted); text-decoration: none; }
    .page-footer a:hover { color: var(--accent2); }
  </style>
</head>
<body>
<!-- bl-nav:canonical -->
<!-- SHARED NAV SNIPPET — standalone apps
     Paste this block immediately after <body> in each standalone app.
     It is self-contained (own palette, no external CSS dependency) so it
     renders identically regardless of the app's own theme.
     To change nav links later, this snippet is the thing to keep in sync;
     prefer generating it from _data/navigation.yml if you automate. -->
<nav class="bl-nav" id="bl-nav">
  <a href="/" class="bl-nav__brand">bensonlabs</a>
  <div class="bl-nav__links">
    <a href="/" class="bl-nav__link">Blog</a>
    <a href="/projects/" class="bl-nav__link">Projects</a>
    <a href="/projects/games/" class="bl-nav__link">Games</a>
    <a href="/projects/workouts/" class="bl-nav__link">Workouts</a>
    <a href="/bootstraps/" class="bl-nav__link">Bootstraps</a>
    <a href="/about/" class="bl-nav__link">About</a>
  </div>
</nav>
<style>
  .bl-nav{display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;
    padding:.6rem 1.25rem;background:#252525;border-bottom:1px solid #3a3a3a;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    position:sticky;top:0;z-index:9999;}
  .bl-nav__brand{color:#a78bfa;font-weight:700;font-size:1.1rem;
    text-decoration:none;letter-spacing:-.01em;}
  .bl-nav__brand:hover{color:#7c3aed;}
  .bl-nav__links{display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap;}
  .bl-nav__link{color:#888;text-decoration:none;font-size:.95rem;
    transition:color .15s;white-space:nowrap;}
  .bl-nav__link:hover{color:#a78bfa;}
  /* Auto-hide: add class="nav-autohide" to <body> of game pages only */
  .nav-autohide .bl-nav{transform:translateY(-100%);transition:transform .2s ease;}
  .nav-autohide .bl-nav.is-visible{transform:translateY(0);}
  .nav-autohide .bl-nav__trigger{position:fixed;top:0;left:0;right:0;height:10px;z-index:9998;}
</style>
<div class="bl-nav__trigger"></div>
<script>
  (function(){
    if(!document.body.classList.contains('nav-autohide'))return;
    var nav=document.getElementById('bl-nav');
    var trigger=document.querySelector('.bl-nav__trigger');
    if(!nav||!trigger)return;
    trigger.addEventListener('mouseenter',function(){nav.classList.add('is-visible');});
    nav.addEventListener('mouseleave',function(){nav.classList.remove('is-visible');});
  })();
</script>

  <div class="page-header">
    <h1>Games <span>↗</span></h1>
    <p>A growing collection of browser-based games.</p>
  </div>

  <div class="games-grid" id="games-grid"></div>

  <script>
    // ── GAMES REGISTRY ──────────────────────────────────────────────────────
    // To add a new game, append an entry to this array.
    const GAMES = [
      {
        title: "2048",
        description: "Slide tiles on a 4×4 grid and merge matching numbers to reach 2048. Classic gameplay with undo, score tracking, and full touch support.",
        emoji: "🔢",
        path: "/projects/games/2048/",
      },
      {
        title: "not-Wordle",
        description: "Guess the hidden 5-letter word in six tries. Each guess reveals which letters are correct, present, or absent. Made by Github Copilot in Github iOS app.",
        emoji: "🟩",
        path: "/projects/games/not-wordle/",
      },
      {
        title: "brick-break",
        description: "Classic brick-breaker with 3 difficulty levels, angle-based paddle physics, level progression, and high-score tracking. Made by Github Copilot in Github iOS app.",
        emoji: "🧱",
        path: "/projects/games/breakout/",
      },
      {
        title: "Orbit Bloom",
        description: "Harvest glowing motes as your shield while surviving an ever-faster comet swarm. Pulse at the right moment to clear the field. Two versions to choose from. Made by GPT-5.4-mini in Hermes-agent on fedora 44 server.",
        emoji: "🌸",
        path: "/projects/games/orbit-bloom/",
      },
      {
        title: "The Last Signal",
        description: "A text-based sci-fi adventure. Play as Dr. Mara Chen investigating an abandoned research station. Three acts, one station, two endings — no keyboard required. Made by Qwen3.6 in Zed IDE on DGX-Spark.",
        emoji: "📡",
        path: "/projects/games/last-signal/",
      },
      {
        title: "Ethereal Wardens",
        description: "Minimalist tower defense — position your wardens strategically to repel waves of enemies before they breach your defenses. Made by Ornith 1.0 in Hermes-agent on DGX-Spark.",
        emoji: "🏰",
        path: "/projects/games/ethereal-wardens/",
      },
      {
        title: "Neon Drift",
        description: "Survive as long as possible in the Neon Drift Zone. Your ship auto-accelerates — manage momentum, drift through tight formations, and graze obstacles to multiply your score. Made by Nemotron 3 Ultra 550b A55b in OpenCat on iOS.",
        emoji: "🚀",
        path: "/projects/games/neon-drift/",
      },
      {
        title: "Echoes of Eternity",
        description: "Static sci-fi survival runner built for GitHub Pages. Collect memory fragments, dodge collapse gates, and keep your best echoes alive between loops.",
        emoji: "🌀",
        path: "/projects/games/echoes-of-eternity/",
      },
    ];
    // ────────────────────────────────────────────────────────────────────────

    const grid = document.getElementById("games-grid");

    GAMES.forEach(game => {
      const card = document.createElement("a");
      card.className = "game-card";
      card.href = game.path;

      const icon = document.createElement("div");
      icon.className = "card-icon";
      icon.textContent = game.emoji;

      const title = document.createElement("div");
      title.className = "card-title";
      title.textContent = game.title;

      const desc = document.createElement("div");
      desc.className = "card-desc";
      desc.textContent = game.description;

      const play = document.createElement("span");
      play.className = "card-play";
      play.textContent = "Play →";

      card.append(icon, title, desc, play);
      grid.appendChild(card);
    });
  </script>

</body>
</html>
