emoji: 🛰️

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NeoSweep XZ9</title>
<style>
/* Enhanced Mobile CSS */
body, html {
  font-family: Arial, sans-serif;
  background-color: #1A1D23; /* Deep Space Blue */
  color: white;
  margin: 0; /* Added for mobile */
  padding: 0; /* Added for mobile */
}
#game-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px; /* Added for mobile comfort */
}
#game-grid {
  display: grid;
  grid-template-columns: repeat(10, 40px);
  gap: 2px;
  width: fit-content;
  margin: auto;
  max-width: 100%; /* Ensure grid doesn't overflow on small screens */
}
.cell {
  width: 40px;
  height: 40px;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #6c5ce7; /* Neon Purple */
  cursor: pointer;
  touch-action: manipulation; /* Improve touch responsiveness */
}
.cell.revealed {
  background-color: #34C759; /* Glow Green */
}
.cell.mine {
  background-color: #FF3737; /* Danger Red */
  color: black;
}
#controls {
  margin-top: 20px;
  text-align: center;
  padding: 0 10px; /* Added for mobile button spacing */
}
button {
  margin: 0 5px;
  padding: 10px 20px; /* Increased for better tap target */
  font-size: 16px; /* Increased for readability */
}
/* Media Query for Smaller Screens */
@media only screen and (max-width: 480px) {
  #game-grid {
    grid-template-columns: repeat(10, 30px); /* Smaller cells on very small screens */
  }
  .cell {
    width: 30px;
    height: 30px;
  }
}
</style>
</head>
<body>
<div id="game-container">
  <h1 style="text-align: center; margin-bottom: 20px;">NeoSweep XZ9</h1>
  <div id="game-grid"></div>
  <div id="controls">
    <button id="scan-btn">Scan (3 remaining)</button>
    <button id="restart-btn">Restart</button>
    <span id="scans-remaining" style="font-size: 18px; margin: 0 10px;"></span>
  </div>
  <!-- Game Over Overlay (New) -->
  <div id="game-over-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; flex-direction: column;">
    <h2>Game Over!</h2>
    <p id="game-over-message"></p>
    <button id="play-again-btn">Play Again</button>
  </div>
</div>

<script>
const GAME_SETTINGS = {
  width: 10,
  height: 10,
  mines: 5,
  scans: 3
};
let gameGrid = [], revealedCells = [], scansRemaining = GAME_SETTINGS.scans;
document.getElementById('scans-remaining').innerText = `Scans: ${scansRemaining}`;

// Initialize Game
initGame();

function initGame() {
  // Reset
  gameGrid = [];
  revealedCells = [];
  scansRemaining = GAME_SETTINGS.scans;
  document.getElementById('scans-remaining').innerText = `Scans: ${scansRemaining}`;
  document.getElementById('game-grid').innerHTML = '';
  document.getElementById('game-over-overlay').style.display = 'none'; // Hide game over screen
  
  // Generate Grid
  for (let y = 0; y < GAME_SETTINGS.height; y++) {
    gameGrid[y] = [];
    for (let x = 0; x < GAME_SETTINGS.width; x++) {
      gameGrid[y][x] = { mine: false, adjacentMines: 0, revealed: false };
    }
  }
  
  // Place Mines
  let minesPlaced = 0;
  while (minesPlaced < GAME_SETTINGS.mines) {
    const x = Math.floor(Math.random() * GAME_SETTINGS.width), y = Math.floor(Math.random() * GAME_SETTINGS.height);
    if (!gameGrid[y][x].mine) {
      gameGrid[y][x].mine = true;
      minesPlaced++;
      // Increment adjacent mines count for neighboring cells
      for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
          if (x + dx >= 0 && x + dx < GAME_SETTINGS.width && y + dy >= 0 && y + dy < GAME_SETTINGS.height) {
            if (!gameGrid[y+dy][x+dx].mine) {
              gameGrid[y+dy][x+dx].adjacentMines++;
            }
          }
        }
      }
    }
  }
  
  // Draw Grid
  const gridElement = document.getElementById('game-grid');
  for (let y = 0; y < GAME_SETTINGS.height; y++) {
    for (let x = 0; x < GAME_SETTINGS.width; x++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.x = x;
      cell.dataset.y = y;
      cell.addEventListener('click', revealCell);
      cell.addEventListener('contextmenu', (e) => { e.preventDefault(); scanCell(x, y); });
      // **New: Long Press for Scan on Mobile**
      let longPress = false;
      cell.addEventListener('touchstart', () => { longPress = true; setTimeout(() => { if (longPress) scanCell(x, y); }, 500); });
      cell.addEventListener('touchend', () => { longPress = false; });
      gridElement.appendChild(cell);
    }
  }
}

document.getElementById('scan-btn').addEventListener('click', scanCellRandom);
document.getElementById('restart-btn').addEventListener('click', initGame);
document.getElementById('play-again-btn').addEventListener('click', initGame); // **New**

function revealCell(e) {
  const cell = e.target;
  const x = parseInt(cell.dataset.x), y = parseInt(cell.dataset.y);
  if (gameGrid[y][x].mine) {
    // **New Game Over Screen**
    document.getElementById('game-over-message').innerText = "Mine triggered! You revealed " + revealedCells.length + " cells.";
    document.getElementById('game-over-overlay').style.display = 'flex';
    return;
  }
  revealCell_COORD(x, y, true);
}

function revealCell_COORD(x, y, directReveal) {
  if (revealedCells.find(coord => coord.x === x && coord.y === y)) return;
  revealedCells.push({x, y});
  const cell = document.querySelector(`#game-grid .cell[data-x="${x}"][data-y="${y}"]`);
  cell.className = 'revealed cell';
  if (gameGrid[y][x].adjacentMines > 0) {
    cell.innerText = gameGrid[y][x].adjacentMines;
  } else if (directReveal) {
    // Recursively reveal adjacent empty cells
    for (let dx = -1; dx <= 1; dx++) {
      for (let dy = -1; dy <= 1; dy++) {
        if (x + dx >= 0 && x + dx < GAME_SETTINGS.width && y + dy >= 0 && y + dy < GAME_SETTINGS.height) {
          revealCell_COORD(x + dx, y + dy, true);
        }
      }
    }
  }
}

function scanCell(x, y) {
  if (scansRemaining <= 0 || revealedCells.find(coord => coord.x === x && coord.y === y)) {
    alert("No scans left or cell already revealed.");
    return;
  }
  scansRemaining--;
  document.getElementById('scans-remaining').innerText = `Scans: ${scansRemaining}`;
  const cell = document.querySelector(`#game-grid .cell[data-x="${x}"][data-y="${y}"]`);
  if (!gameGrid[y][x].mine) {
    cell.className = 'revealed cell';
    setTimeout(() => {
      if (!gameGrid[y][x].mine && !cell.className.includes('revealed')) {
        revealCell_COORD(x, y, false);
      } else {
        cell.className = 'cell';
      }
    }, 1500);
    if (gameGrid[y][x].adjacentMines > 0) {
      cell.innerText = gameGrid[y][x].adjacentMines;
      setTimeout(() => { cell.innerText = ''; }, 1500);
    }
  } else {
    alert("Scan blocked by a mine!");
  }
}

function scanCellRandom() {
  if (scansRemaining <= 0) {
    alert("No scans left.");
    return;
  }
  const x = Math.floor(Math.random() * GAME_SETTINGS.width), y = Math.floor(Math.random() * GAME_SETTINGS.height);
  scanCell(x, y);
}
</script>
</body>
</html>
