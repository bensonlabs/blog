<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NeoSweep XZ9</title>
<style>
body, html {
  font-family: Arial, sans-serif;
  background-color: #1A1D23;
  color: white;
  margin: 0;
  padding: 0;
}
#game-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
  margin-top: 56px;
}
#game-grid {
  display: grid;
  gap: 0;
  width: fit-content;
  margin: auto;
  overflow: hidden;
  box-sizing: border-box;
}
.cell {
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #6c5ce7;
  cursor: pointer;
  touch-action: manipulation;
  font-size: inherit;
  box-sizing: border-box;
  outline: 1px solid rgba(0, 0, 0, 0.3);
}
.cell:focus {
  outline: 2px solid white;
  box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
}
.cell.revealed {
  background-color: #33CC33;
  outline: none;
}
.cell.mine {
  background-color: #FF3737;
  color: black;
}
#controls {
  margin-top: 20px;
  text-align: center;
  padding: 0 10px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
select {
  padding: 10px 20px;
  font-size: 16px;
  background-color: #333;
  color: white;
  border: 1px solid #6c5ce7;
  border-radius: 4px;
  cursor: pointer;
}
button {
  margin: 0 5px;
  padding: 10px 20px;
  font-size: 16px;
  cursor: pointer;
}
button:disabled {
  background-color: #555;
  cursor: not-allowed;
}
.info-label {
  font-size: 18px;
  margin: 0 10px;
}
</style>
</head>
<body>
<main id="game-container">
  <h1 style="text-align: center; margin-bottom: 20px;">NeoSweep XZ9</h1>
  <div id="game-grid"></div>
  <div id="controls">
    <select id="difficulty-select">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="scan-btn">Scan (3 remaining)</button>
    <button id="restart-btn">Restart</button>
    <span id="scans-remaining" class="info-label"></span>
    <span id="mines-info" class="info-label"></span>
  </div>
  <div id="game-over-overlay" role="dialog" aria-live="assertive" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; flex-direction: column;">
    <h2 id="game-result-title">Game Over!</h2>
    <p id="game-over-message"></p>
    <button id="play-again-btn">Play Again</button>
  </div>
</main>

<script>
const DIFFICULTY_PRESETS = {
  easy:   { width: 8,  height: 8,  mines: 5,  scans: 5 },
  medium: { width: 10, height: 10, mines: 10, scans: 5 },
  hard:   { width: 12, height: 12, mines: 20, scans: 3 }
};

let currentDifficulty = 'medium';

function getSettings() {
  return {
    width: DIFFICULTY_PRESETS[currentDifficulty].width,
    height: DIFFICULTY_PRESETS[currentDifficulty].height,
    mines: DIFFICULTY_PRESETS[currentDifficulty].mines,
    scans: DIFFICULTY_PRESETS[currentDifficulty].scans
  };
}

const gameGridElement = document.getElementById('game-grid');
const gameOverMessageElement = document.getElementById('game-over-message');
const gameResultTitle = document.getElementById('game-result-title');
const gameOverOverlay = document.getElementById('game-over-overlay');
const scansElement = document.getElementById('scans-remaining');
const minesInfoElement = document.getElementById('mines-info');
const scanButton = document.getElementById('scan-btn');
const difficultySelect = document.getElementById('difficulty-select');

let gameGrid = [], revealedCells = [], scansRemaining = 0, totalMines = 0;
scansElement.innerText = '';
minesInfoElement.innerText = '';

difficultySelect.addEventListener('change', () => {
  currentDifficulty = difficultySelect.value;
  initGame();
});

initGame();

function updateScanButton() {
  scanButton.innerText = `Scan (${scansRemaining} remaining)`;
}

function initGame() {
  const settings = getSettings();
  gameGrid = [];
  revealedCells = [];
  scansRemaining = settings.scans;
  totalMines = settings.mines;
  scansElement.innerText = `Scans: ${scansRemaining}`;
  minesInfoElement.innerText = `Mines: ${totalMines}`;
  updateScanButton();
  gameGridElement.innerHTML = '';
  gameOverOverlay.style.display = 'none';
  scanButton.disabled = false;

  const vw = window.innerWidth - 40;
  const vh = window.innerHeight - 300;
  const maxCellSize = Math.floor(Math.min(vw, vh) / Math.max(settings.width, settings.height));
  const cellSize = Math.min(40, Math.max(20, maxCellSize));

  gameGridElement.style.gridTemplateColumns = `repeat(${settings.width}, ${cellSize}px)`;
  gameGridElement.style.gridAutoRows = `${cellSize}px`;

  for (let y = 0; y < settings.height; y++) {
    gameGrid[y] = [];
    for (let x = 0; x < settings.width; x++) {
      gameGrid[y][x] = { mine: false, adjacentMines: 0, revealed: false };
    }
  }

  let minesPlaced = 0;
  while (minesPlaced < settings.mines) {
    const x = Math.floor(Math.random() * settings.width);
    const y = Math.floor(Math.random() * settings.height);
    if (!gameGrid[y][x].mine) {
      gameGrid[y][x].mine = true;
      minesPlaced++;
      for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
          if (x + dx >= 0 && x + dx < settings.width && y + dy >= 0 && y + dy < settings.height) {
            if (!gameGrid[y + dy][x + dx].mine) {
              gameGrid[y + dy][x + dx].adjacentMines++;
            }
          }
        }
      }
    }
  }

  for (let y = 0; y < settings.height; y++) {
    for (let x = 0; x < settings.width; x++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.width = cellSize + 'px';
      cell.style.height = cellSize + 'px';
      cell.dataset.x = x;
      cell.dataset.y = y;
      cell.setAttribute('tabindex', '0');
      cell.addEventListener('click', revealCell);
      cell.addEventListener('contextmenu', (e) => { e.preventDefault(); scanCell(x, y); });
      let longPress = false;
      cell.addEventListener('touchstart', () => { longPress = true; setTimeout(() => { if (longPress) scanCell(x, y); }, 500); });
      cell.addEventListener('touchend', () => { longPress = false; });
      gameGridElement.appendChild(cell);
    }
  }
}

scanButton.addEventListener('click', scanCellRandom);
document.getElementById('restart-btn').addEventListener('click', initGame);
document.getElementById('play-again-btn').addEventListener('click', initGame);

function revealCell(e) {
  const cell = e.target;
  const x = parseInt(cell.dataset.x);
  const y = parseInt(cell.dataset.y);
  if (gameGrid[y][x].mine) {
    const settings = getSettings();
    const totalSafeCells = settings.width * settings.height - settings.mines;
    gameOverMessageElement.innerText = `Mine triggered! You revealed ${revealedCells.length} of ${totalSafeCells} safe cells.`;
    gameResultTitle.innerText = "Game Over!";
    gameOverOverlay.style.display = 'flex';
    scanButton.disabled = true;
    return;
  }
  revealCell_COORD(x, y, true);
}

function revealCell_COORD(x, y, directReveal) {
  if (revealedCells.find(coord => coord.x === x && coord.y === y)) return;
  revealedCells.push({x, y});
  const cell = gameGridElement.querySelector(`.cell[data-x="${x}"][data-y="${y}"]`);
  if (!cell) return;
  cell.className = 'revealed cell';
  if (gameGrid[y][x].adjacentMines > 0) {
    cell.innerText = gameGrid[y][x].adjacentMines;
  } else if (directReveal) {
    const settings = getSettings();
    for (let dx = -1; dx <= 1; dx++) {
      for (let dy = -1; dy <= 1; dy++) {
        if (x + dx >= 0 && x + dx < settings.width && y + dy >= 0 && y + dy < settings.height) {
          revealCell_COORD(x + dx, y + dy, true);
        }
      }
    }
  }

  const settings = getSettings();
  const totalSafeCells = settings.width * settings.height - settings.mines;
  if (revealedCells.length >= totalSafeCells) {
    gameResultTitle.innerText = "🎉 You Win!";
    gameOverMessageElement.innerText = `Cleared the grid with ${scansRemaining} scans remaining!`;
    gameOverOverlay.style.display = 'flex';
    scansElement.innerText = `Scans: 0`;
    updateScanButton();
    scanButton.disabled = true;
  }
}

function scanCell(x, y) {
  if (scansRemaining <= 0 || revealedCells.find(coord => coord.x === x && coord.y === y)) {
    alert("No scans left or cell already revealed.");
    return;
  }
  scansRemaining--;
  scansElement.innerText = `Scans: ${scansRemaining}`;
  updateScanButton();
  const cell = gameGridElement.querySelector(`.cell[data-x="${x}"][data-y="${y}"]`);
  if (!cell) return;
  if (!gameGrid[y][x].mine) {
    cell.className = 'revealed cell';
    setTimeout(() => {
      if (gameGrid[y][x].mine) {
        cell.className = 'cell';
      } else {
        revealCell_COORD(x, y, false);
      }
    }, 1500);
    if (gameGrid[y][x].adjacentMines > 0) {
      cell.innerText = gameGrid[y][x].adjacentMines;
      setTimeout(() => { cell.innerText = ''; }, 1500);
    }
  } else {
    alert("Scan blocked by a mine!");
  }
}

function scanCellRandom() {
  if (scansRemaining <= 0) {
    alert("No scans left.");
    return;
  }
  const settings = getSettings();
  const x = Math.floor(Math.random() * settings.width);
  const y = Math.floor(Math.random() * settings.height);
  scanCell(x, y);
}
</script>
</main>
</body>
</html>
