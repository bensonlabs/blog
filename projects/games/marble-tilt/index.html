<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Marble Tilt</title>
  <style>
    :root {
      --wood-bg: #2b1d12;
      --board-color: #dcb378;
      --board-dark: #b88a4c;
      --brass: #e0aa3e;
      --brass-dark: #9e731b;
      --felt-green: #1a3d2f;
      --text-light: #f4ebd9;
      --danger: #b23b3b;
      --success: #2e7d32;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      touch-action: none;
    }

    body {
      background-color: var(--wood-bg);
      background-image: radial-gradient(circle at center, #3d2b1d 0%, #1a100a 100%);
      color: var(--text-light);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 10px;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 800px;
      gap: 10px;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: var(--felt-green);
      border: 2px solid var(--brass);
      border-radius: 8px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.6), 0 4px 8px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 1.2rem;
      color: var(--brass);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
      text-shadow: 1px 1px 2px #000;
    }

    .stats {
      display: flex;
      gap: 16px;
      font-family: monospace;
      font-size: 1rem;
      color: var(--text-light);
    }

    .stat-label {
      color: var(--brass);
      margin-right: 4px;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 720px;
      aspect-ratio: 16 / 9;
      background: #111;
      border: 12px solid var(--wood-bg);
      border-image: linear-gradient(to bottom right, #5c3a21, #2b1d12) 1;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.9);
      border-radius: 8px;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(20, 12, 8, 0.88);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 20px;
      text-align: center;
      z-index: 10;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h2 {
      font-size: 1.8rem;
      color: var(--brass);
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .overlay p {
      font-size: 0.95rem;
      max-width: 480px;
      line-height: 1.4;
      color: var(--text-light);
    }

    .controls-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .btn {
      background: linear-gradient(to bottom, var(--brass), var(--brass-dark));
      color: #1a100a;
      border: 1px solid #ffda73;
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
      transition: all 0.1s ease;
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }

    .btn-secondary {
      background: linear-gradient(to bottom, #4a382a, #2b1d12);
      color: var(--brass);
      border: 1px solid var(--brass-dark);
    }

    .touch-pad {
      position: absolute;
      inset: 0;
      z-index: 5;
    }
  </style>
</head>
<body>

<div class="game-container">
  <header>
    <h1>Marble Tilt</h1>
    <div class="stats">
      <div><span class="stat-label">TIME:</span><span id="timer">00:00</span></div>
      <div><span class="stat-label">LIVES:</span><span id="lives">3</span></div>
    </div>
  </header>

  <div class="canvas-wrapper" id="canvasContainer">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <!-- Touch capture layer for virtual joystick fallback -->
    <div class="touch-pad" id="touchPad"></div>

    <!-- UI Overlays -->
    <div id="startOverlay" class="overlay">
      <h2>Marble Tilt</h2>
      <p>Guide the marble to the green goal ring while avoiding the dark pit hazards.</p>
      <p>Use phone tilt or drag/touch on the screen to control board incline.</p>
      <div class="controls-bar" style="margin-top:10px;">
        <button id="enableMotionBtn" class="btn">Enable Motion Controls</button>
        <button id="startGameBtn" class="btn btn-secondary">Play with Touch / Mouse</button>
      </div>
    </div>

    <div id="winOverlay" class="overlay hidden">
      <h2 style="color: var(--brass);">Level Cleared!</h2>
      <p id="winStats">Completed in 00:00</p>
      <button class="btn restartBtn">Play Again</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
      <h2 style="color: var(--danger);">Game Over</h2>
      <p>You ran out of lives!</p>
      <button class="btn restartBtn">Try Again</button>
    </div>
  </div>

  <div class="controls-bar">
    <button id="calibrateBtn" class="btn btn-secondary">Calibrate Tilt</button>
    <button class="btn btn-secondary restartBtn">Restart</button>
  </div>
</div>

<script>
  // Game Setup & Constants
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const timerEl = document.getElementById('timer');
  const livesEl = document.getElementById('lives');
  const touchPad = document.getElementById('touchPad');

  const CANVAS_WIDTH = 800;
  const CANVAS_HEIGHT = 450;

  // Game State
  let gameState = 'MENU'; // MENU, PLAYING, WIN, GAMEOVER
  let lives = 3;
  let startTime = 0;
  let elapsedTime = 0;
  let timerInterval = null;

  // Orientation / Tilt Control State
  let tiltX = 0; // -1 to 1
  let tiltY = 0; // -1 to 1
  let rawGamma = 0;
  let rawBeta = 0;
  let calibGamma = 0;
  let calibBeta = 0;
  let motionActive = false;

  // Touch fallback control state
  let isTouching = false;
  let touchStartX = 0;
  let touchStartY = 0;

  // Physics Config
  const GRAVITY = 0.35;
  const DAMPING = 0.985;
  const BOUNCE = 0.4;

  // Marble definition
  const marble = {
    x: 60,
    y: 60,
    vx: 0,
    vy: 0,
    radius: 12
  };

  // Level Setup: Goals, Start, Holes, Walls
  const startPos = { x: 60, y: 60 };
  const goal = { x: 740, y: 390, radius: 20 };

  const holes = [
    { x: 180, y: 100, radius: 16 },
    { x: 300, y: 300, radius: 16 },
    { x: 450, y: 150, radius: 16 },
    { x: 550, y: 380, radius: 16 },
    { x: 650, y: 220, radius: 16 },
    { x: 220, y: 390, radius: 16 }
  ];

  const walls = [
    // Outer boundaries
    { x: 10, y: 10, w: 780, h: 10 },
    { x: 10, y: 430, w: 780, h: 10 },
    { x: 10, y: 10, w: 10, h: 430 },
    { x: 780, y: 10, w: 10, h: 430 },

    // Interior maze dividers
    { x: 120, y: 10, w: 10, h: 280 },
    { x: 120, y: 350, w: 10, h: 90 },
    { x: 230, y: 120, w: 180, h: 10 },
    { x: 230, y: 220, w: 10, h: 150 },
    { x: 330, y: 220, w: 10, h: 130 },
    { x: 430, y: 10, w: 10, h: 280 },
    { x: 430, y: 350, w: 180, h: 10 },
    { x: 530, y: 120, w: 150, h: 10 },
    { x: 670, y: 120, w: 10, h: 220 }
  ];

  // Motion Detection Permission Handling
  async function requestMotionPermission() {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const permissionState = await DeviceOrientationEvent.requestPermission();
        if (permissionState === 'granted') {
          attachOrientationListener();
        } else {
          alert('Motion control permission rejected. Touch controls enabled.');
        }
      } catch (error) {
        console.warn('Orientation permission error:', error);
      }
    } else {
      attachOrientationListener();
    }
  }

  function attachOrientationListener() {
    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', handleOrientation, true);
      motionActive = true;
    }
  }

  function handleOrientation(e) {
    if (e.gamma === null || e.beta === null) return;
    rawGamma = e.gamma; // [-90, 90]
    rawBeta = e.beta;   // [-180, 180]

    // Normalize with calibration offset
    let g = rawGamma - calibGamma;
    let b = rawBeta - calibBeta;

    // Clamp angles to +-30 degrees for max force
    g = Math.max(-30, Math.min(30, g));
    b = Math.max(-30, Math.min(30, b));

    tiltX = g / 30;
    tiltY = b / 30;
  }

  function calibrate() {
    calibGamma = rawGamma;
    calibBeta = rawBeta;
  }

  // Touch Controls Implementation
  touchPad.addEventListener('pointerdown', (e) => {
    isTouching = true;
    touchStartX = e.clientX;
    touchStartY = e.clientY;
  });

  touchPad.addEventListener('pointermove', (e) => {
    if (!isTouching) return;
    const dx = e.clientX - touchStartX;
    const dy = e.clientY - touchStartY;
    const maxDist = 50;

    tiltX = Math.max(-1, Math.min(1, dx / maxDist));
    tiltY = Math.max(-1, Math.min(1, dy / maxDist));
  });

  const endTouch = () => {
    if (!motionActive) {
      isTouching = false;
      tiltX = 0;
      tiltY = 0;
    }
  };

  touchPad.addEventListener('pointerup', endTouch);
  touchPad.addEventListener('pointercancel', endTouch);

  // Timer Management
  function startTimer() {
    startTime = Date.now() - elapsedTime;
    timerInterval = setInterval(() => {
      elapsedTime = Date.now() - startTime;
      const totalSecs = Math.floor(elapsedTime / 1000);
      const mins = String(Math.floor(totalSecs / 60)).padStart(2, '0');
      const secs = String(totalSecs % 60).padStart(2, '0');
      timerEl.textContent = `${mins}:${secs}`;
    }, 200);
  }

  function stopTimer() {
    clearInterval(timerInterval);
  }

  function resetGame() {
    lives = 3;
    elapsedTime = 0;
    timerEl.textContent = '00:00';
    livesEl.textContent = lives;
    resetMarble();
  }

  function resetMarble() {
    marble.x = startPos.x;
    marble.y = startPos.y;
    marble.vx = 0;
    marble.vy = 0;
  }

  function startGame() {
    resetGame();
    gameState = 'PLAYING';
    document.querySelectorAll('.overlay').forEach(el => el.classList.add('hidden'));
    startTimer();
  }

  // Handle visibility changes (Pause timer when tab inactive)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stopTimer();
    } else if (gameState === 'PLAYING') {
      startTimer();
    }
  });

  // Physics & Collision Logic
  function updatePhysics() {
    if (gameState !== 'PLAYING') return;

    // Apply tilt acceleration
    marble.vx += tiltX * GRAVITY;
    marble.vy += tiltY * GRAVITY;

    // Apply damping
    marble.vx *= DAMPING;
    marble.vy *= DAMPING;

    // Move step
    marble.x += marble.vx;
    marble.y += marble.vy;

    // Wall Collisions
    for (const w of walls) {
      // Find closest point on rectangle wall to circle
      const closestX = Math.max(w.x, Math.min(marble.x, w.x + w.w));
      const closestY = Math.max(w.y, Math.min(marble.y, w.y + w.h));

      const distX = marble.x - closestX;
      const distY = marble.y - closestY;
      const distanceSquared = (distX * distX) + (distY * distY);

      if (distanceSquared < (marble.radius * marble.radius)) {
        const distance = Math.sqrt(distanceSquared);
        const overlap = marble.radius - distance;

        let nx = distance === 0 ? 1 : distX / distance;
        let ny = distance === 0 ? 0 : distY / distance;

        marble.x += nx * overlap;
        marble.y += ny * overlap;

        // Bounce reflection
        const dot = marble.vx * nx + marble.vy * ny;
        marble.vx = (marble.vx - 2 * dot * nx) * BOUNCE;
        marble.vy = (marble.vy - 2 * dot * ny) * BOUNCE;
      }
    }

    // Hole Hazards Detection
    for (const h of holes) {
      const dx = marble.x - h.x;
      const dy = marble.y - h.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < h.radius * 0.75) {
        // Fall into hole
        lives--;
        livesEl.textContent = lives;
        if (lives <= 0) {
          gameState = 'GAMEOVER';
          stopTimer();
          document.getElementById('gameOverOverlay').classList.remove('hidden');
        } else {
          resetMarble();
        }
        return;
      }
    }

    // Goal Detection
    const gdx = marble.x - goal.x;
    const gdy = marble.y - goal.y;
    if (Math.sqrt(gdx * gdx + gdy * gdy) < goal.radius * 0.8) {
      gameState = 'WIN';
      stopTimer();
      document.getElementById('winStats').textContent = `Completed in ${timerEl.textContent}`;
      document.getElementById('winOverlay').classList.remove('hidden');
    }
  }

  // Rendering Mechanics
  function draw() {
    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    // Board background (warm wood finish)
    ctx.fillStyle = '#c89b5c';
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    // Subtle wood texture lines
    ctx.strokeStyle = '#ba8d4f';
    ctx.lineWidth = 1;
    for (let i = 0; i < CANVAS_HEIGHT; i += 15) {
      ctx.beginPath();
      ctx.moveTo(0, i);
      ctx.lineTo(CANVAS_WIDTH, i);
      ctx.stroke();
    }

    // Draw Holes
    for (const h of holes) {
      ctx.beginPath();
      ctx.arc(h.x, h.y, h.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#110b07';
      ctx.fill();
      ctx.strokeStyle = '#5a4128';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    // Draw Goal Area
    ctx.beginPath();
    ctx.arc(goal.x, goal.y, goal.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#2e7d32';
    ctx.fill();
    ctx.strokeStyle = '#81c784';
    ctx.lineWidth = 4;
    ctx.stroke();

    // Draw Walls
    for (const w of walls) {
      // Wall drop shadow
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(w.x + 4, w.y + 4, w.w, w.h);

      // Main wall structure
      ctx.fillStyle = '#5c3a21';
      ctx.fillRect(w.x, w.y, w.w, w.h);

      // Brass top trim
      ctx.strokeStyle = '#e0aa3e';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(w.x, w.y, w.w, w.h);
    }

    // Draw Marble
    // Marble drop shadow
    ctx.beginPath();
    ctx.arc(marble.x + 3, marble.y + 3, marble.radius, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.fill();

    // Steel / Silver Marble gradient
    const grad = ctx.createRadialGradient(
      marble.x - 3, marble.y - 3, 2,
      marble.x, marble.y, marble.radius
    );
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.3, '#d6d6d6');
    grad.addColorStop(0.8, '#707070');
    grad.addColorStop(1, '#333333');

    ctx.beginPath();
    ctx.arc(marble.x, marble.y, marble.radius, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // Main Loop
  function loop() {
    updatePhysics();
    draw();
    requestAnimationFrame(loop);
  }

  // Button Bindings & UI Setup
  document.getElementById('enableMotionBtn').addEventListener('click', async () => {
    await requestMotionPermission();
    startGame();
  });

  document.getElementById('startGameBtn').addEventListener('click', startGame);
  document.getElementById('calibrateBtn').addEventListener('click', calibrate);

  document.querySelectorAll('.restartBtn').forEach(btn => {
    btn.addEventListener('click', startGame);
  });

  // Start engine loop
  requestAnimationFrame(loop);
</script>
</body>
</html>
