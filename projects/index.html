<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — Benson Labs</title>
  <style>
    /* ── OBSIDIAN DARK THEME ── */
    :root {
      --bg:      #1e1e1e;
      --surface: #252525;
      --card:    #2d2d2d;
      --border:  #3a3a3a;
      --text:    #dcddde;
      --muted:   #888;
      --accent:  #7c3aed;
      --accent2: #a78bfa;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 60px;
    }

    /* ── HEADER ── */
    .page-header {
      width: 100%;
      max-width: 860px;
      margin-bottom: 40px;
      padding-top: 40px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 20px;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--accent2); }

    .page-header h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .page-header h1 span { color: var(--accent2); }

    .page-header p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 1rem;
    }

    /* ── PROJECT GRID ── */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 860px;
    }

    /* ── PROJECT CARD ── */
    .project-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      outline-offset: 3px;
    }

    .project-card:hover,
    .project-card:focus-visible {
      border-color: var(--accent2);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.2);
    }

    .card-icon {
      font-size: 2.6rem;
      line-height: 1;
      user-select: none;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .card-desc {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.55;
      flex: 1;
    }

    .card-cta {
      display: inline-block;
      margin-top: 4px;
      padding: 9px 20px;
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.3px;
      transition: background 0.15s, opacity 0.15s;
      pointer-events: none;
    }
    .project-card:hover .card-cta,
    .project-card:focus-visible .card-cta { background: var(--accent2); }
    .project-card:active .card-cta { opacity: 0.8; }

    /* ── FOOTER ── */
    .page-footer {
      margin-top: 60px;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .page-footer a { color: var(--muted); text-decoration: none; }
    .page-footer a:hover { color: var(--accent2); }
  </style>
</head>
<body>
<!-- bl-nav:canonical -->
<!-- SHARED NAV SNIPPET - standalone apps. Paste immediately after <body>. Keep byte-identical. -->
<nav class="bl-nav" id="bl-nav">
  <a href="/" class="bl-nav__brand">bensonlabs</a>
  <button class="bl-nav__toggle" id="bl-nav-toggle" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <div class="bl-nav__links" id="bl-nav-links">
    <a href="/" class="bl-nav__link">Blog</a>
      <a href="/projects/" class="bl-nav__link">Projects</a>
      <a href="/projects/games/" class="bl-nav__link">Games</a>
      <a href="/projects/workouts/" class="bl-nav__link">Workouts</a>
      <a href="/bootstraps/" class="bl-nav__link">Bootstraps</a>
      <a href="/about/" class="bl-nav__link">About</a>
  </div>
</nav>
<style>
  #bl-nav{
    display:flex;align-items:center;justify-content:space-between;
    gap:1rem;padding:.4rem 1rem;min-height:44px;
    background:#252525 !important;border-bottom:1px solid #3a3a3a;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    position:sticky;top:0;z-index:99999;box-sizing:border-box;align-self:stretch;width:100%;
  }
  #bl-nav *{box-sizing:border-box;}
  #bl-nav .bl-nav__brand{
    color:#a78bfa !important;font-weight:700;font-size:1.05rem;
    text-decoration:none !important;letter-spacing:-.01em;flex:0 0 auto;line-height:1;
  }
  #bl-nav .bl-nav__brand:hover{color:#7c3aed !important;}
  #bl-nav .bl-nav__links{display:flex;align-items:center;gap:1.4rem;}
  #bl-nav .bl-nav__link{
    color:#c9c9c9 !important;text-decoration:none !important;
    font-size:.9rem;white-space:nowrap;transition:color .15s;line-height:1;
    background:none !important;border:none;padding:0;
  }
  #bl-nav .bl-nav__link:hover{color:#a78bfa !important;}
  #bl-nav .bl-nav__link.is-active{color:#fff !important;font-weight:600;}
  #bl-nav .bl-nav__toggle{
    display:none;flex-direction:column;gap:5px;
    background:none !important;border:none;cursor:pointer;padding:6px;flex:0 0 auto;
  }
  #bl-nav .bl-nav__toggle span{
    display:block;width:22px;height:2px;background:#dcddde;border-radius:2px;
    transition:transform .2s,opacity .2s;
  }
  #bl-nav.is-open .bl-nav__toggle span:nth-child(1){transform:translateY(7px) rotate(45deg);}
  #bl-nav.is-open .bl-nav__toggle span:nth-child(2){opacity:0;}
  #bl-nav.is-open .bl-nav__toggle span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

  @media (max-width:820px){
    #bl-nav .bl-nav__toggle{display:flex !important;}
    #bl-nav .bl-nav__links{
      display:none !important;position:absolute;top:100%;left:0;right:0;
      flex-direction:column;align-items:stretch;gap:0;
      background:#252525 !important;border-bottom:1px solid #3a3a3a;
      padding:.25rem 0;
    }
    #bl-nav.is-open .bl-nav__links{display:flex !important;}
    #bl-nav .bl-nav__link{
      width:100%;padding:.7rem 1rem !important;font-size:1rem;
    }
    #bl-nav .bl-nav__link:hover{background:#2d2d2d !important;}
  }

  /* Auto-hide (games only): opaque, slides fully out of view */
  .nav-autohide #bl-nav{position:fixed;top:0;left:0;right:0;transform:translateY(-100%);transition:transform .2s ease;}
  .nav-autohide #bl-nav.is-visible,
  .nav-autohide #bl-nav.is-open{transform:translateY(0);}
  .nav-autohide .bl-nav__trigger{position:fixed;top:0;left:0;right:0;height:14px;z-index:99998;}
  .nav-autohide .bl-nav__menu-fab{
    position:fixed;top:8px;right:8px;z-index:99998;
    width:40px;height:40px;border-radius:8px;border:none;cursor:pointer;
    background:rgba(37,37,37,.85) !important;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;padding:0;
  }
  .nav-autohide .bl-nav__menu-fab span{display:block;width:18px;height:2px;background:#dcddde;border-radius:2px;}
  .nav-autohide.is-revealed .bl-nav__menu-fab{display:none;}
</style>
<div class="bl-nav__trigger"></div>
<button class="bl-nav__menu-fab" id="bl-nav-fab" aria-label="Open menu"><span></span><span></span><span></span></button>
<script>
  (function(){
    var nav=document.getElementById('bl-nav');
    var toggle=document.getElementById('bl-nav-toggle');
    if(nav&&toggle){
      toggle.addEventListener('click',function(){
        var open=nav.classList.toggle('is-open');
        toggle.setAttribute('aria-expanded',open?'true':'false');
      });
    }
    if(document.body.classList.contains('nav-autohide')){
      var trigger=document.querySelector('.bl-nav__trigger');
      var fab=document.getElementById('bl-nav-fab');
      function reveal(){nav.classList.add('is-visible');document.body.classList.add('is-revealed');}
      function hide(){if(!nav.classList.contains('is-open')){nav.classList.remove('is-visible');document.body.classList.remove('is-revealed');}}
      if(trigger){
        trigger.addEventListener('mouseenter',reveal);
      }
      if(fab){
        fab.addEventListener('click',function(){reveal();nav.classList.add('is-open');});
      }
      if(nav){ nav.addEventListener('mouseleave',hide); }
    } else {
      // non-game pages: remove the game-only FAB if present
      var fab=document.getElementById('bl-nav-fab'); if(fab) fab.remove();
    }
  })();
</script>


  <div class="page-header">
    <h1>Projects <span>↗</span></h1>
    <p>Interactive tools and experiments built for the browser.</p>
  </div>

  <div class="projects-grid" id="projects-grid"></div>

  <script>
    const PROJECTS = [
      {
        title: "Gravitas",
        description: "High-fidelity N-body gravity simulator with real-time orbital projection, procedural ambient audio, and a glassmorphic telemetry dashboard.",
        emoji: "🔭",
        path: "/projects/gravitas/",
        cta: "Launch →",
      },
      {
        title: "Focus Lab",
        description: "Premium productivity dashboard with Pomodoro timer, focus tasks, synthesized ambient sounds, and weekly metrics.",
        emoji: "🎯",
        path: "/projects/focus-lab/",
        cta: "Open →",
      },
      {
        title: "AI Trending",
        description: "Daily analysis of trending AI/ML repositories on GitHub with ranked results, category filtering, and repository scoring.",
        emoji: "🤖",
        path: "/projects/ai-trending/",
        cta: "View →",
      },
      {
        title: "Games",
        description: "A growing collection of browser-based games including 2048, not-Wordle, brick-break, Orbit Bloom, The Last Signal, LumenTrace, and Echoes of Eternity.",
        emoji: "🎮",
        path: "/projects/games/",
        cta: "Play →",
      },
      {
        title: "Neon To-Do",
        description: "Full-stack todo app backed by Neon Postgres. Create, complete, filter, and delete tasks with real-time persistence — no signup required.",
        emoji: "✅",
        path: "https://todo-app-l3m0.onrender.com",
        cta: "Open →",
      },
      {
        title: "Workouts",
        description: "Workout tracking and exercise routines.",
        emoji: "💪",
        path: "/projects/workouts/",
        cta: "Open →",
      },
    ];

    const grid = document.getElementById("projects-grid");

    PROJECTS.forEach(project => {
      const card = document.createElement("a");
      card.className = "project-card";
      card.href = project.path;

      const icon = document.createElement("div");
      icon.className = "card-icon";
      icon.textContent = project.emoji;

      const title = document.createElement("div");
      title.className = "card-title";
      title.textContent = project.title;

      const desc = document.createElement("div");
      desc.className = "card-desc";
      desc.textContent = project.description;

      const cta = document.createElement("span");
      cta.className = "card-cta";
      cta.textContent = project.cta;

      card.append(icon, title, desc, cta);
      grid.appendChild(card);
    });
  </script>

</body>
</html>
