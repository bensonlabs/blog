title: "b  e  n  s  o  n  l  a  b  s"
description: "Troubleshooting fixes and personal notes"
url: "https://bensonlabs.org"
baseurl: ""
author:
  name: "Justin Benson"
  Github: "@bensonlabs"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Feed
feed:
  path: feed.xml

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Justin Benson"
  # Kept out of the sitemap: redirects, and pages the site doesn't list (their card says
  # listed: no). Defaults reach static pages too.
  - scope:
      path: "bootstraps/index.html"
    values:
      sitemap: false
  - scope:
      path: "projects/ai-trending/index.html"
    values:
      sitemap: false
  - scope:
      path: "projects/weight-room"
    values:
      sitemap: false

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .jekyll-cache
  - vendor/
  - vendor/bundle/
  - node_modules/
  - CONTRIBUTING.md
  - docs/
